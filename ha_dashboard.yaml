views:
  - title: AIO
    path: aio
    panel: true
    cards:
      - type: custom:floorplan-card
        full_height: false
        config:
          image: /local/froeling/froeling_aio.svg
          cache: false
          stylesheet: /local/froeling/home.css
          defaults:
            hover_action: hover-info
            tap_action: more-info
          rules:
            - entities:
                - sensor.froeling_austragung_pelletlager_restbestand
                - sensor.froeling_austragung_resetierbarer_t_zaehler
              tap_action: false
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data: ${entity.state + "t"}
            - entities:
                - sensor.froeling_kessel_abgastemperatur
                - sensor.froeling_kessel_temperatur
                - sensor.froeling_puffer01_temperatur_oben
                - sensor.froeling_puffer01_temperatur_unten
                - sensor.froeling_anlage_aussentemperatur
                - sensor.froeling_hk01_vorlauf_isttemperatur
                - >-
                  sensor.froeling_zirkulationspumpe_ruecklauftemperatur_an_der_zirkulations_leitung
                - climate.wohnzimmer
              tap_action: false
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data: ${entity.state + "°C"}
            - entities:
                - sensor.froeling_kessel_restsauerstoffgehalt
                - sensor.froeling_puffer01_pufferpumpen_ansteuerung
                - sensor.froeling_kessel_saugzug_ansteuerung
                - sensor.froeling_austragung_pelletsbehaelter_fuellstand
                - sensor.froeling_puffer01_ladezustand
                - >-
                  sensor.froeling_zirkulationspumpe_drehzahl_der_zirkulations_pumpe
              tap_action: false
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data: ${entity.state + "%"}
            - entities:
                - >-
                  sensor.froeling_kessel_verbleibende_heizstunden_bis_zur_asche_entleeren_warnung
              tap_action: false
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data: ${entity.state + "h"}
            - entities:
                - sensor.froeling_kessel_zustand
              tap_action: false
              state_action:
                action: call-service
                service: floorplan.class_set
                service_data:
                  class: |-
                    ${
                      (entity.state == "Betriebsbereit") ? "fill-grey" :
                      (entity.state == "Heizen") ? "fill-red" :
                      (entity.state == "SH Heizen") ? "fill-red" :
                      (entity.state == "Anheizen") ? "fill-orange" :
                      "fill-grey"
                    }
            - entities:
                - binary_sensor.froeling_puffer01_pufferpumpe_an_aus
                - binary_sensor.froeling_zirkulationspumpe_an_aus
                - binary_sensor.froeling_hk01_pumpe_an_aus
              tap_action: false
              state_action:
                action: call-service
                service: floorplan.class_set
                service_data:
                  class: '${(entity.state == "on") ? "fill-green" : "fill-grey"}'
  - title: Kessel
    badges: []
    cards:
      - type: custom:froeling-kessel-card
        entities:
          - id: txt_ash-counter
            entity: >-
              sensor.froeling_kessel_verbleibende_heizstunden_bis_zur_asche_entleeren_warnung
            label: Verbleibende Heizstunden bis zur Entleerung des Aschebehälters
          - id: txt_fuel-level
            entity: sensor.froeling_austragung_pelletsbehaelter_fuellstand
            label: Füllstand im Pelletsbehälter
          - id: txt_fan-rpm
            entity: sensor.froeling_kessel_saugzugdrehzahl
            label: Drehzahl des Saugzuggebläses
          - id: txt_boiler-temp
            entity: sensor.froeling_kessel_temperatur
            label: Kesseltemperatur
          - id: txt_flue-gas
            entity: sensor.froeling_kessel_abgastemperatur
            label: Abgastemperatur
          - id: txt_lambda
            entity: sensor.froeling_kessel_restsauerstoffgehalt
            label: Restsauerstoffgehalt
          - id: txt_pump-01-rpm
            entity: sensor.froeling_puffer01_pufferpumpen_ansteuerung
            label: Pufferpumpen Ansteuerung
          - id: obj_flame
            entity: sensor.froeling_kesselzustand
            label: Kesselzustand
            stateClasses:
              Vorheizen: stHeatingOn
              Heizen: stHeatingOn
              SH Heizen: stHeatingOn
              default: stHeatingOff
          - id: obj_pump
            entity: binary_sensor.froeling_puffer01_pufferpumpe_an_aus
            label: Pufferpumpe AN AUS
            stateClasses:
              "on": stPumpActive
              default: stPumpInActive
      - type: entities
        entities:
          - entity: sensor.froeling_kessel_temperatur
            name: Kesseltemperatur
            secondary_info: last-changed
          - entity: sensor.froeling_kessel_abgastemperatur
            name: Abgastemperatur
            secondary_info: last-changed
          - entity: >-
              sensor.froeling_kessel_verbleibende_heizstunden_bis_zur_asche_entleeren_warnung
            name: Verbleibende Heizstunden bis zur Asche entleeren Warnung
            secondary_info: last-changed
          - entity: sensor.froeling_kessel_saugzug_ansteuerung
            name: Saugzug - Ansteuerung
            secondary_info: last-changed
          - entity: sensor.froeling_kessel_restsauerstoffgehalt
            name: Restsauerstoffgehalt
            secondary_info: last-changed
          - entity: sensor.froeling_kessel_primaerluft
            name: Primärluft
            secondary_info: last-changed
          - entity: sensor.froeling_kessel_sekundaerluft
            name: Sekundärluft
            secondary_info: last-changed
          - entity: sensor.froeling_kessel_ruecklauffuehler
            name: Rücklauffühler
            secondary_info: last-changed
        title: Zustand
      - type: entities
        entities:
          - entity: number.froeling_kessel_solltemperatur
            name: Kessel-Solltemperatur
        title: Einstellungen
  - title: Heizkreis01
    path: hk01
    badges: []
    cards:
      - type: custom:froeling-heizkreis-card
        entities:
          - id: txt_outside-temp
            entity: sensor.froeling_anlage_aussentemperatur
            label: Außentemperatur
          - id: txt_flow-temp
            entity: sensor.froeling_hk01_vorlauf_isttemperatur
            label: Vorlauftemperatur
          - id: obj_pump-01
            entity: binary_sensor.froeling_hk01_pumpe_an_aus
            label: Heizkreispumpe AN AUS
            stateClasses:
              "on": stPumpActive
              default: stPumpInActive
      - type: entities
        entities:
          - entity: sensor.froeling_hk01_vorlauf_isttemperatur
            name: Vorlauf-Isttempratur
            secondary_info: last-changed
          - entity: sensor.froeling_hk01_vorlauf_solltemperatur
            name: Vorlauf-Solltemperatur
          - entity: sensor.froeling_anlage_aussentemperatur
            name: Außentemperatur
            secondary_info: last-changed
        title: Zustand
      - type: entities
        entities:
          - entity: number.froeling_hk01_vorlauf_temperatur_minus_10c_aussentemperatur
            name: Gewünschte Vorlauf-temperatur bei -10°C Außentemperatur
          - entity: number.froeling_hk01_vorlauf_temperatur_10c_aussentemperatur
            name: Gewünschte Vorlauf-temperatur bei +10°C Außentemperatur
          - entity: >-
              number.froeling_hk01_heizkreispumpe_ausschalten_wenn_vorlauf_soll_kleiner_ist_als
            name: Heizkreispumpe ausschalten wenn Vorlauf Soll kleiner ist als
          - entity: >-
              number.froeling_hk01_absenkung_der_vorlauftemperatur_im_absenkbetrieb
            name: Absenkung der Vorlauftemperatur im Absenkbetrieb
          - entity: >-
              number.froeling_hk01_aussentemperatur_unter_der_die_heizkreispumpe_im_heizbetrieb_einschaltet
            name: >-
              Außentemperatur, unter der die Heizkreispumpe im Heizbetrieb
              einschaltet
          - entity: >-
              number.froeling_hk01_aussentemperatur_unter_der_die_heizkreispumpe_im_absenkbetrieb_einschaltet
            name: >-
              Außentemperatur, unter der die Heizkreispumpe im Absenkbetrieb
              einschaltet
          - entity: number.froeling_hk01_frostschutztemperatur
            name: Frostschutztemperatur
          - entity: >-
              number.froeling_hk01_temp_am_puffer_oben_ab_der_der_ueberhitzungsschutz_aktiv_wird
            name: Temp. am Puffer oben ab der der Überhitzungsschutz aktiv wird
        title: Einstellungen
  - title: Heizkreis02
    path: hk02
    badges: []
    cards:
      - type: entities
        entities:
          - entity: sensor.froeling_hk01_vorlauf_isttemperatur
            name: Vorlauf-Isttempratur
            secondary_info: last-changed
          - entity: sensor.froeling_hk01_vorlauf_solltemperatur
            name: Vorlauf-Solltemperatur
          - entity: sensor.froeling_anlage_aussentemperatur
            name: Außentemperatur
            secondary_info: last-changed
        title: Zustand
      - type: entities
        entities:
          - entity: number.froeling_hk02_vorlauf_temperatur_minus_10c_aussentemperatur
            name: Gewünschte Vorlauf-temperatur bei -10°C Außentemperatur
          - entity: number.froeling_hk02_vorlauf_temperatur_10c_aussentemperatur
            name: Gewünschte Vorlauf-temperatur bei +10°C Außentemperatur
          - entity: >-
              number.froeling_hk02_heizkreispumpe_ausschalten_wenn_vorlauf_soll_kleiner_ist_als
            name: Heizkreispumpe ausschalten wenn Vorlauf Soll kleiner ist als
          - entity: >-
              number.froeling_hk02_absenkung_der_vorlauftemperatur_im_absenkbetrieb
            name: Absenkung der Vorlauftemperatur im Absenkbetrieb
          - entity: >-
              number.froeling_hk02_aussentemperatur_unter_der_die_heizkreispumpe_im_heizbetrieb_einschaltet
            name: >-
              Außentemperatur, unter der die Heizkreispumpe im Heizbetrieb
              einschaltet
          - entity: >-
              number.froeling_hk02_aussentemperatur_unter_der_die_heizkreispumpe_im_absenkbetrieb_einschaltet
            name: >-
              Außentemperatur, unter der die Heizkreispumpe im Absenkbetrieb
              einschaltet
          - entity: number.froeling_hk02_frostschutztemperatur
            name: Frostschutztemperatur
          - entity: >-
              number.froeling_hk02_temp_am_puffer_oben_ab_der_der_ueberhitzungsschutz_aktiv_wird
            name: Temp. am Puffer oben ab der der Überhitzungsschutz aktiv wird
        title: Einstellungen
      - type: custom:froeling-heizkreis-card
        entities:
          - id: txt_outside-temp
            entity: sensor.froeling_anlage_aussentemperatur
            label: Außentemperatur
          - id: txt_flow-temp
            entity: sensor.froeling_hk02_vorlauf_isttemperatur
            label: Vorlauftemperatur
          - id: obj_pump-01
            entity: binary_sensor.froeling_hk02_pumpe_an_aus
            label: Heizkreispumpe AN AUS
            stateClasses:
              "on": stPumpActive
              default: stPumpInActive
  - title: Boiler01
    path: boiler01
    badges: []
    cards:
      - type: custom:froeling-boiler-card
        entities:
          - id: txt_pump-01-rpm
            entity: sensor.froeling_boiler01_pumpe_ansteuerung
            label: Boiler Pumpe Ansteuerung
          - id: txt_dhw-temp
            entity: sensor.froeling_boiler01_temperatur_oben
            label: Boilertemperatur oben
          - id: obj_pump-01
            entity: binary_sensor.froeling_boiler01_pumpe_an_aus
            label: Zirkulationspumpe AN/AUS
            stateClasses:
              "on": stPumpActive
              default: stPumpInActive
      - type: entities
        entities:
          - entity: sensor.froeling_boiler01_temperatur_oben
            name: Temperatur Oben
            secondary_info: last-changed
          - entity: sensor.froeling_boiler01_pumpe_ansteuerung
            name: Pumpe Ansteuerung
            secondary_info: last-changed
        title: Zustand
      - type: entities
        entities:
          - entity: number.froeling_boiler01_gewuenschte_boilertemperatur
            name: Gewünschte Boilertemperatur
          - entity: number.froeling_boiler01_nachladen_wenn_boilertemperatur_unter
            name: Nachladen wenn Boilertemperatur unter
        title: Einstellungen
    type: masonry
  - title: Puffer01
    path: puffer01
    badges: []
    cards:
      - type: custom:froeling-puffer-card
        entities:
          - id: txt_pump-01-rpm
            entity: sensor.froeling_puffer01_pufferpumpen_ansteuerung
            label: Pufferpumpen Ansteuerung
          - id: txt_buffer-load
            entity: sensor.froeling_puffer01_ladezustand
            label: Ladezustand des Pufferspeichers
          - id: txt_buffer-lower-sensor
            entity: sensor.froeling_puffer01_temperatur_unten
            label: Tempertaur unten im Pufferspeicher
          - id: txt_buffer-upper-sensor
            entity: sensor.froeling_puffer01_temperatur_oben
            label: Tempertaur oben im Pufferspeicher
          - id: obj_pump
            entity: binary_sensor.froeling_puffer01_pufferpumpe_an_aus
            label: Pufferpumpe AN AUS
            stateClasses:
              "on": stPumpActive
              default: stPumpInActive
      - type: entities
        entities:
          - entity: sensor.froeling_puffer01_temperatur_oben
            name: Temperatur Oben
            secondary_info: last-changed
          - entity: sensor.froeling_puffer01_temperatur_unten
            name: Temperatur Unten
            secondary_info: last-changed
          - entity: sensor.froeling_puffer01_ladezustand
            name: Ladezustand
            secondary_info: last-changed
          - entity: sensor.froeling_puffer01_pufferpumpen_ansteuerung
            name: Pufferpumpen Ansteuerung
            secondary_info: last-changed
        title: Zustand
      - type: entities
        entities: []
        title: Einstellungen
    type: masonry
  - title: Austragung
    path: austragung
    badges: []
    cards:
      - type: custom:froeling-austragung-card
        entities:
          - id: txt_fuel-level
            entity: sensor.froeling_austragung_pelletsbehaelter_fuellstand
            label: Füllstand im Pelletsvorratsbehälter
          - id: txt_consumption
            entity: sensor.froeling_austragung_pelletverbrauch_gesamt
            label: Pelletverbrauch Gesamt
          - id: txt_storage-counter
            entity: sensor.froeling_austragung_pelletlager_restbestand
            label: Restbestand im Brennstofflagerraum
      - type: entities
        entities:
          - entity: sensor.froeling_austragung_pelletsbehaelter_fuellstand
            name: Sacksilo Füllstand
          - entity: sensor.froeling_austragung_resetierbarer_t_zaehler
            name: Zählwert Verbauch
          - entity: sensor.froeling_austragung_resetierbarer_kg_zaehler
            name: Zählwert Verbauch
          - entity: sensor.froeling_austragung_pelletlager_restbestand
            secondary_info: last-changed
            name: Sacksilo Restbestand
          - entity: sensor.froeling_austragung_pelletverbrauch_gesamt
            name: Gesamtverbauch seit Beginn
        title: Zustand
      - type: entities
        entities: []
        title: Einstellungen
  - title: Zirk. Pumpe
    path: zirk-pumpe
    badges: []
    cards:
      - type: custom:froeling-zirkulationspumpe-card
        entities:
          - id: txt_circulation-pump-rpm
            entity: sensor.froeling_zirkulationspumpe_drehzahl
            label: Ansteuerung der Zirkulationspumpe
          - id: txt_circulation-temp
            entity: >-
              sensor.froeling_zirkulationspumpe_ruecklauftemperatur_an_der_zirkulations_leitung
            label: Rücklauftemperatur an der Zirkulationsleitung
          - id: obj_pump-01
            entity: binary_sensor.froeling_zirkulationspumpe_an_aus
            label: Zirkulationspumpe AN/AUS
            stateClasses:
              "on": stPumpActive
              default: stPumpInActive
      - type: entities
        entities:
          - entity: >-
              sensor.froeling_zirkulationspumpe_ruecklauftemperatur_an_der_zirkulations_leitung
            name: Rücklauftemperatur an der Zirkulations Leitung
            secondary_info: last-changed
          - entity: >-
              sensor.froeling_zirkulationspumpe_stoemungsschalter_an_der_brauchwasser_leitung
            name: Strömungsschalter an der Brauchwasser Leitung
            secondary_info: last-changed
          - entity: sensor.froeling_zirkulationspumpe_drehzahl
            name: Drehzahl der Zirkulations Pumpe
            secondary_info: last-changed
        title: Zustand
      - type: entities
        entities:
          - entity: >-
              number.froeling_kessel_bei_welcher_rl_temperatur_an_der_zirkulationsleitung_soll_die_pumpe_ausschalten
            name: >-
              Bei welcher RL Temperatur an der Zirkulationsleitung soll die
              Pumpe ausschalten
        title: Einstellungen
  - title: Solarthermie
    path: solarthermie
    badges: []
    cards:
      - type: custom:floorplan-card
        full_height: false
        config:
          image: /local/froeling/froeling_solarthermie.svg
          cache: false
          stylesheet: /local/froeling/home.css
          defaults:
            hover_action: hover-info
            tap_action: more-info
          rules:
            - entities:
                - sensor.froeling_laufzeit_kollektorpumpe
              tap_action: false
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data: ${entity.state + "°C"}
            - entities:
                - sensor.froeling_laufzeit_kollektorpumpe
              tap_action: false
              state_action:
                action: call-service
                service: floorplan.text_set
                service_data: ${entity.state + "%"}
            - entities:
                - binary_sensor.froeling_kollektorpumpe_an_aus
              tap_action: false
              state_action:
                action: call-service
                service: floorplan.class_set
                service_data:
                  class: '${(entity.state == "on") ? "fill-green" : "fill-grey"}'
      - type: entities
        entities:
          - entity: sensor.froeling_solar_kollektor_ruecklauftemperatur
            secondary_info: last-changed
            name: Kollektor Rücklauftemperatur
          - entity: sensor.froeling_solar_kollektor_vorlauftemperatur
            name: Kollektor Vorlauftemperatur
            secondary_info: last-changed
          - entity: sensor.froeling_solar_kollektortemperatur
            name: Kollektortemperatur
            secondary_info: last-changed
          - entity: sensor.froeling_solar_aktuelle_leistung_wmz
            name: Aktuelle Leistung WMZ
            secondary_info: last-changed
          - entity: sensor.froeling_solar_ansteuerung_kollektorpumpe
            name: Ansteuerung Kollektorpumpe
            secondary_info: last-changed
          - entity: sensor.froeling_solar_aktuelle_ansteuerung_kollektor_boiler_pumpe
            name: Ansteuerung Kollektor-/Boilerpumpe
            secondary_info: last-changed
          - entity: sensor.froeling_solar_dfl_sensor_l_pro_h
            name: Durchflusssensor
            secondary_info: last-changed
          - entity: sensor.froeling_solar_tagesertrag
            name: Tagesertrag
            secondary_info: none
          - entity: sensor.froeling_solar_gesamtertrag_kwh
            name: Gesamtertrag
          - entity: sensor.froeling_solar_ventil_fuer_umschaltung_puffer_oben_unten
            name: Ventil für Umschaltung Puffer oben/unten
            secondary_info: last-changed
        title: Zustand
      - type: entities
        entities:
          - entity: >-
              sensor.froeling_zirkulationspumpe_ruecklauftemperatur_an_der_zirkulations_leitung
            name: Rücklauftemperatur an der Zirkulations Leitung
          - entity: >-
              sensor.froeling_zirkulationspumpe_stoemungsschalter_an_der_brauchwasser_leitung
            name: Strömungsschalter an der Brauchwasser Leitung
          - entity: sensor.froeling_zirkulationspumpe_drehzahl_der_zirkulations_pumpe
            name: Drehzahl der Zirkulations Pumpe
        title: Einstellungen
