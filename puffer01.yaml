sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "puffer01_temperatur_oben"
    register_type: read
    address: 2000
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "puffer01_temperatur_mitte"
    register_type: read
    address: 2001
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "puffer01_temperatur_unten"
    register_type: read
    address: 2002
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "puffer01_pufferpumpen_ansteuerung"
    id: "puffer01_pufferpumpen_ansteuerung"
    register_type: read
    address: 2003
    unit_of_measurement: "%"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "puffer01_ladezustand"
    register_type: read
    address: 2006
    unit_of_measurement: "%"
    value_type: U_WORD

binary_sensor:
  - platform: template
    name: "puffer01_pufferpumpe_an_aus"
    lambda: |-
      if (id(Puffer_1_Pufferpumpen_Ansteuerung).state > 0) {
        return true;
      } else {
        return false;
      }
