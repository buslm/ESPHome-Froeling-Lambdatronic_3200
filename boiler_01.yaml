sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Boiler 1 Temperatur oben"
    register_type: read
    address: 1630
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Boiler 1 Pumpe Ansteuerung"
    id: "${name}_Boiler_1_Pumpe_Ansteuerung"
    register_type: read
    address: 1632
    unit_of_measurement: "%"
    value_type: U_WORD

number:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Boiler 1 Gewünschte Boilertemperatur"
    address: 1631
    unit_of_measurement: "°C"
    value_type: U_WORD
    multiply: 2
    min_value: 10
    max_value: 100

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Boiler 1 Nachladen, wenn Boilertemperatur unter"
    address: 1632
    unit_of_measurement: "°C"
    value_type: U_WORD
    multiply: 2
    min_value: 1
    max_value: 90

binary_sensor:
  - platform: template
    name: "Boiler 1 Pumpe Ansteuerung AN AUS"
    lambda: |-
      if (id(${name}_Boiler_1_Pumpe_Ansteuerung).state > 0) {
        return true;
      } else {
        return false;
      }
