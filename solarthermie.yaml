sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Solar - Kollektor Rücklauftemperatur"
    register_type: read
    address: 2611
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Solar - Kollektor Vorlauftemperatur"
    register_type: read
    address: 2612
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Solar - Kollektortemperatur"
    register_type: read
    address: 2601
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Aktuelle Leistung Solar WMZ"
    register_type: read
    address: 2610
    unit_of_measurement: "kw"
    device_class: "power"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Ansteuerung Kollektorpumpe"
    register_type: read
    address: 2600
    unit_of_measurement: "%"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Aktuelle Ansteuerung der Kollektor - Boiler Pumpe"
    register_type: read
    address: 2622
    unit_of_measurement: "h"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Solar - DFL Sensor [l/h]"
    register_type: read
    address: 2609
    unit_of_measurement: "l/h"
    device_class: "volume_flow_rate"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Solar - Tagesertrag"
    register_type: read
    address: 2619
    unit_of_measurement: "kwh"
    device_class: "energy"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Solar - Gesamtertrag kWh"
    register_type: read
    address: 2621
    unit_of_measurement: "kwh"
    device_class: "energy"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Solar - Ventil für Umschaltung Puffer oben und unten"
    register_type: read
    address: 2607
    unit_of_measurement: "%"
    value_type: U_WORD
