sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "solar_kollektor_ruecklauftemperatur"
    register_type: read
    address: 2611
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "solar_kollektor_vorlauftemperatur"
    register_type: read
    address: 2612
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "solar_kollektortemperatur"
    register_type: read
    address: 2601
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "solar_aktuelle_leistung_wmz"
    register_type: read
    address: 2610
    unit_of_measurement: "kw"
    device_class: "power"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "solar_ansteuerung_kollektorpumpe"
    register_type: read
    address: 2600
    unit_of_measurement: "%"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "solar_aktuelle_ansteuerung_kollektor_boiler_pumpe"
    register_type: read
    address: 2622
    unit_of_measurement: "h"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "solar_dfl_sensor_l_pro_h"
    register_type: read
    address: 2609
    unit_of_measurement: "l/h"
    device_class: "volume_flow_rate"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "solar_tagesertrag"
    register_type: read
    address: 2619
    unit_of_measurement: "kwh"
    device_class: "energy"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "solar_gesamtertrag_kwh"
    register_type: read
    address: 2621
    unit_of_measurement: "kwh"
    device_class: "energy"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "solar_ventil_fuer_umschaltung_puffer_oben_unten"
    register_type: read
    address: 2607
    unit_of_measurement: "%"
    value_type: U_WORD
