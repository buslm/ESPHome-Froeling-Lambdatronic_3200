sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "zirkulationspumpe_ruecklauftemperatur_an_der_zirkulations_leitung"
    register_type: read
    address: 711
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "zirkulationspumpe_stoemungsschalter_an_der_brauchwasser_leitung"
    register_type: read
    address: 600
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "zirkulationspumpe_drehzahl"
    id: "zirkulationspumpe_drehzahl"
    register_type: read
    address: 710
    unit_of_measurement: "%"
    value_type: U_WORD

binary_sensor:
  - platform: template
    name: "zirkulationspumpe_an_aus"
    lambda: |-
      if (id(zirkulationspumpe_drehzahl).state > 0) {
        return true;
      } else {
        return false;
      }
