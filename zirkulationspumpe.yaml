sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Rücklauftemperatur an der Zirkulations Leitung"
    register_type: read
    address: 711
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Strömungsschalter an der Brauchwasser Leitung"
    register_type: read
    address: 600
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Drehzahl der Zirkulations Pumpe"
    id: ${name}_Drehzahl_der_Zirkulations_Pumpe
    register_type: read
    address: 710
    unit_of_measurement: "%"
    value_type: U_WORD

binary_sensor:
  - platform: template
    name: "${name} Zirkulationspumpe AN AUS"
    lambda: |-
      if (id(${name}_Drehzahl_der_Zirkulations_Pumpe).state > 0) {
        return true;
      } else {
        return false;
      }
