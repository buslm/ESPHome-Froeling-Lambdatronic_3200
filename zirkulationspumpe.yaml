sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Ruecklauftemperatur_an_der_Zirkulations_Leitung"
    register_type: read
    address: 711
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    value_type: U_WORD
    filters:
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Stoemungsschalter_an_der_Brauchwasser_Leitung"
    register_type: read
    address: 600
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Drehzahl_der_Zirkulations_Pumpe"
    id: Drehzahl_der_Zirkulations_Pumpe
    register_type: read
    address: 710
    unit_of_measurement: "%"
    value_type: U_WORD

binary_sensor:
  - platform: template
    name: "zirkulationspumpe_an_aus"
    lambda: |-
      if (id(Drehzahl_der_Zirkulations_Pumpe).state > 0) {
        return true;
      } else {
        return false;
      }
