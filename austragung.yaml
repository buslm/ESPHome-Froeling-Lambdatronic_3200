sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "austragung_pelletsbehaelter_fuellstand"
    register_type: read
    address: 21
    unit_of_measurement: "%"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.0048309178743961

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "austragung_resetierbarer_kg_zaehler"
    register_type: read
    address: 81
    unit_of_measurement: "kg"
    device_class: "weight"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "austragung_resetierbarer_t_zaehler"
    register_type: read
    address: 82
    unit_of_measurement: "t"
    device_class: "weight"
    state_class: "measurement"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "austragung_pelletverbrauch_gesamt"
    register_type: read
    address: 83
    unit_of_measurement: "t"
    device_class: "weight"
    state_class: "measurement"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "austragung_pelletlager_restbestand"
    register_type: holding
    address: 319
    unit_of_measurement: "t"
    device_class: "weight"
    state_class: "measurement"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1
